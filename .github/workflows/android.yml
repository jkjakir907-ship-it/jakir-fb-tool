
name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: gradle -p extracted/JAKIR_FB_TOOL assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JAKIR-FB-TOOL-APK
          path: extracted/JAKIR_FB_TOOL/app/build/outputs/apk/debug/app-debug.apk

